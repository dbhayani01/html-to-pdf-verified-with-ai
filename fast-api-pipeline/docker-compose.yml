services:
  fast-api-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: html-to-pdf-fastapi:local
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      CHROME_BINARY: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

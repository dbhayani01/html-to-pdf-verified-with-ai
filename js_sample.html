<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Performance Report</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .report-container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #f8f9fa;
            padding: 20px;
            border-left: 5px solid #2ecc71;
            border-radius: 4px;
        }
        .card.blue { border-left-color: #3498db; }
        .card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; color: #2c3e50; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f4f6f7;
            color: #34495e;
        }
        tr:hover {
            background-color: #fdfefe;
        }
    </style>
</head>
<body>

<div class="report-container">
    <h1>Executive Sales Report</h1>
    
    <!-- JavaScript Filter Controls -->
    <div class="controls">
        <label for="regionFilter"><strong>Filter by Region:</strong></label>
        <select id="regionFilter" onchange="filterData()">
            <option value="All">All Regions</option>
            <option value="North">North</option>
            <option value="South">South</option>
            <option value="East">East</option>
            <option value="West">West</option>
        </select>
        <button onclick="window.print()">Print Report</button>
    </div>

    <!-- Summary Metrics Calculated by JavaScript -->
    <div class="metrics-grid">
        <div class="card">
            <h3>Total Revenue</h3>
            <p id="totalRevenue">\$0.00</p>
        </div>
        <div class="card blue">
            <h3>Total Units Sold</h3>
            <p id="totalUnits">0</p>
        </div>
    </div>

    <!-- Data Table -->
    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Region</th>
                <th>Units Sold</th>
                <th>Revenue</th>
            </tr>
        </thead>
        <tbody id="reportData">
            <!-- JavaScript will populate rows here -->
        </tbody>
    </table>
</div>

<script>
    // Sample report dataset
    const salesData = [
        { product: "Alpha Wireless Mouse", region: "North", units: 150, revenue: 3750 },
        { product: "Beta Mechanical Keyboard", region: "South", units: 80, revenue: 7200 },
        { product: "Gamma 4K Monitor", region: "East", units: 45, revenue: 15750 },
        { product: "Delta USB-C Hub", region: "West", units: 210, revenue: 5250 },
        { product: "Epsilon Ergonomic Chair", region: "North", units: 30, revenue: 9000 },
        { product: "Zeta Noise-Cancelling Headphones", region: "West", units: 95, revenue: 14250 }
    ];

    // Function to calculate metrics and render table rows
    function renderReport(data) {
        const tableBody = document.getElementById("reportData");
        let totalRevenue = 0;
        let totalUnits = 0;
        let tableHTML = "";

        // Loop through the data to build the HTML rows and compute metrics
        data.forEach(item => {
            totalRevenue += item.revenue;
            totalUnits += item.units;

            tableHTML += `
                <tr>
                    <td><strong>${item.product}</strong></td>
                    <td>${item.region}</td>
                    <td>${item.units.toLocaleString()}</td>
                    <td>$${item.revenue.toLocaleString()}</td>
                </tr>
            `;
        });

        // Inject the generated HTML rows into the table body
        tableBody.innerHTML = tableHTML;

        // Update the metric summary cards
        document.getElementById("totalRevenue").innerText = `$${totalRevenue.toLocaleString()}`;
        document.getElementById("totalUnits").innerText = totalUnits.toLocaleString();
    }

    // Function triggered when the user changes the dropdown filter
    function filterData() {
        const selectedRegion = document.getElementById("regionFilter").value;
        
        if (selectedRegion === "All") {
            renderReport(salesData);
        } else {
            const filtered = salesData.filter(item => item.region === selectedRegion);
            renderReport(filtered);
        }
    }

    // Initial load to display all data when the page opens
    window.onload = function() {
        renderReport(salesData);
    };
</script>

</body>
</html>
